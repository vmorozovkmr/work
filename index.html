<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Отчётность</title>
  <!-- Telegram Web Apps SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --primary:#248bca; --muted:#666; --bg:#fff; }
    body { font-family:Arial,sans-serif; padding:16px; background:var(--bg); color:#111; }
    .container { max-width:760px; margin:0 auto; }
    h1 { text-align:center; font-size:20px; margin-bottom:8px; }
    .choice { display:flex; gap:12px; justify-content:center; margin:20px 0; }
    .choice button { flex:1; padding:14px 10px; border-radius:10px; border:1px solid #ccc; cursor:pointer; background:#fafafa; font-weight:600; }
    .choice button.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
    .section { margin-bottom:14px; border-bottom:1px solid #eee; padding-bottom:12px; }
    .title { font-weight:700; margin-bottom:8px; }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; }
    .row label { flex:1; }
    input[type="number"] { box-sizing:border-box; width:160px; max-width:50%; padding:8px; border:1px solid #ccc; border-radius:6px; }
    button.send { width:100%; padding:12px; border-radius:10px; background:var(--primary); color:#fff; border:none; cursor:pointer; font-size:16px; }
    button.send:disabled { opacity:.65; cursor:wait; }
    button.secondary { background:#f0f0f0; color:#333; border:1px solid #ddd; padding:8px 10px; border-radius:8px; cursor:pointer; }
    #status { margin-top:8px; min-height:20px; color:green; }
    #preview { white-space:pre-wrap; background:#fafafa; padding:10px; border-radius:8px; border:1px solid #eee; font-family:inherit; margin-top:10px; }
    .hidden { display:none; }
    .controls { display:flex; gap:8px; margin-top:8px; }
    .back { margin-bottom:10px; display:inline-block; cursor:pointer; color:var(--muted); }
    .hint { font-size:13px; color:var(--muted); margin-bottom:6px; }
    .center { text-align:center; }
    @media (max-width:420px) {
      body { padding:12px; }
      .choice { gap:8px; }
      .choice button { padding:12px 8px; font-size:13px; }
      .controls { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Отчётность</h1>
    <div id="choice-screen" class="section">
      <div class="title">Выберите тип отчёта</div>
      <div class="choice">
        <button id="btn-morning" class="primary">📊 УТРЕННИЙ ОТЧЁТ</button>
        <button id="btn-evening">📊 ВЕЧЕРНИЙ ОТЧЁТ</button>
      </div>
      <div class="hint center">Выберите нужный отчёт — форма и превью появятся ниже.</div>
    </div>

    <div id="form-screen" class="hidden">
      <div class="back" id="btn-back">← Вернуться к выбору</div>

      <div class="section">
        <div class="title">💰 Финансовый остаток</div>
        <div class="hint">Указывайте суммы в рублях (можно с копейками через точку)</div>
        <div class="row">
          <label for="onec">🧮 1С:</label>
          <input type="number" id="onec" placeholder="руб." min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="row">
          <label for="cash">💵 Касса:</label>
          <input type="number" id="cash" placeholder="руб." min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="row">
          <label for="notebook_shortage">📒 Недостача по тетради:</label>
          <input type="number" id="notebook_shortage" placeholder="руб." min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="controls">
        <button id="preview-btn" class="secondary">Показать/Обновить превью</button>
        <button id="send-btn" class="send">Отправить отчёт</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="preview" class="hidden" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const REPORT_API_URL = "https://telegram-report-ruby.vercel.app/api/report";
    const SEND_TIMEOUT_MS = 45000;
    const DRAFT_KEY = 'report_form_draft_financial_v5';

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

    const choiceScreen = document.getElementById('choice-screen');
    const formScreen = document.getElementById('form-screen');
    const btnMorning = document.getElementById('btn-morning');
    const btnEvening = document.getElementById('btn-evening');
    const btnBack = document.getElementById('btn-back');
    const previewDiv = document.getElementById('preview');
    const previewBtn = document.getElementById('preview-btn');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    const fields = {
      onec: document.getElementById('onec'),
      cash: document.getElementById('cash'),
      notebook_shortage: document.getElementById('notebook_shortage')
    };

    let currentType = null;

    function setStatus(text, isError=false) {
      statusEl.textContent = text || '';
      statusEl.style.color = isError ? 'crimson' : 'green';
    }

    function parseMoney(value) {
      if (value === undefined || value === null || value === '') return null;
      const amount = Number(String(value).replace(',', '.'));
      return Number.isFinite(amount) && amount >= 0 ? amount : null;
    }

    function buildReportText(type) {
      const reportTitle = type === 'evening' ? 'ВЕЧЕРНИЙ' : 'УТРЕННИЙ';
      return [
        `📊 ${reportTitle} ОТЧЁТ`,
        '',
        '💰 Финансовый остаток',
        `🧮 1С: ${fields.onec.value || '0'} руб.`,
        `💵 Касса: ${fields.cash.value || '0'} руб.`,
        `📒 Недостача по тетради: ${fields.notebook_shortage.value || '0'} руб.`
      ].join('\n');
    }

    function updatePreview() {
      if (!currentType) return;
      previewDiv.textContent = buildReportText(currentType);
      previewDiv.classList.remove('hidden');
      setStatus('Превью обновлено', false);
      setTimeout(() => {
        if (statusEl.textContent === 'Превью обновлено') setStatus('');
      }, 1200);
    }

    function validate() {
      const amounts = Object.values(fields).map(field => parseMoney(field.value));
      if (amounts.some(amount => amount === null)) {
        return { ok: false, msg: 'Заполните все три поля корректными суммами (числа не меньше 0).' };
      }
      return { ok: true };
    }

    function saveDraft() {
      try {
        const draft = { type: currentType };
        Object.keys(fields).forEach(key => {
          draft[key] = fields[key].value;
        });
        localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      } catch (e) {}
    }

    function loadDraftIfMatches(type) {
      try {
        const raw = localStorage.getItem(DRAFT_KEY);
        if (!raw) return;
        const draft = JSON.parse(raw);
        if (draft.type && draft.type !== type) return;
        Object.keys(fields).forEach(key => {
          if (draft[key] !== undefined) fields[key].value = draft[key];
        });
      } catch (e) {}
    }

    function clearDraft() {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    let saveTimer = null;
    function onFieldChange() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveDraft();
        saveTimer = null;
        setStatus('Черновик сохранён', false);
        setTimeout(() => setStatus(''), 1200);
      }, 700);
    }

    Object.values(fields).forEach(field => {
      field.addEventListener('input', () => {
        onFieldChange();
        updatePreview();
      });
    });

    async function postWithTimeout(url, body, timeoutMs) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return response;
      } catch (error) {
        clearTimeout(timeoutId);
        throw error;
      }
    }

    async function sendReport() {
      setStatus('', false);
      const validation = validate();
      if (!validation.ok) {
        setStatus(validation.msg, true);
        return;
      }

      sendBtn.disabled = true;
      const previousButtonText = sendBtn.textContent;
      sendBtn.textContent = 'Отправка...';

      const payload = {
        tg_init_data: tg?.initData || null,
        data: {
          type: currentType,
          onec: fields.onec.value,
          cash: fields.cash.value,
          notebook_shortage: fields.notebook_shortage.value
        },
        report_text: buildReportText(currentType),
        created_at: new Date().toISOString()
      };

      try {
        const response = await postWithTimeout(REPORT_API_URL, payload, SEND_TIMEOUT_MS);
        if (response.ok) {
          setStatus('Отчёт успешно отправлен', false);
          clearDraft();
          sendBtn.textContent = 'Отправлено';
          setTimeout(() => {
            try { if (tg) tg.close(); } catch (e) {}
            sendBtn.disabled = false;
            sendBtn.textContent = previousButtonText;
          }, 900);
        } else {
          let message = `Сервер вернул ${response.status}`;
          try {
            const result = await response.json();
            if (result?.error) message += ` — ${result.error}`;
          } catch (e) {}
          setStatus(message, true);
          sendBtn.disabled = false;
          sendBtn.textContent = previousButtonText;
        }
      } catch (error) {
        if (error.name === 'AbortError') setStatus('Превышено время ожидания отправки.', true);
        else setStatus('Ошибка сети или сервера.', true);
        sendBtn.disabled = false;
        sendBtn.textContent = previousButtonText;
      }
    }

    function openForm(type) {
      currentType = type;
      choiceScreen.classList.add('hidden');
      formScreen.classList.remove('hidden');
      loadDraftIfMatches(type);
      updatePreview();
    }

    btnMorning.addEventListener('click', () => openForm('morning'));
    btnEvening.addEventListener('click', () => openForm('evening'));
    btnBack.addEventListener('click', () => {
      formScreen.classList.add('hidden');
      choiceScreen.classList.remove('hidden');
      previewDiv.classList.add('hidden');
      setStatus('');
    });
    previewBtn.addEventListener('click', updatePreview);
    sendBtn.addEventListener('click', sendReport);

    // Авто-открытие по ?type=morning|evening
    (function autoOpenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      if (type === 'morning' || type === 'evening') openForm(type);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчетность</title>
    <!-- ИСПРАВЛЕНО: Подключен корректный скрипт Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 15px; 
            background: var(--tg-theme-bg-color, #fff); 
            color: var(--tg-theme-text-color, #000); 
        }
        .section { margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .title { font-weight: bold; margin-bottom: 8px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        input[type="number"] { width: 100px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        select { padding: 5px; border-radius: 4px; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--tg-theme-button-color, #248bca); 
            color: var(--tg-theme-button-text-color, white); 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <h2 id="report-title">📊 ОТЧЕТ</h2>

    <div id="evening-only">
        <div class="section">
            <div class="title">📂 Документооборот и учет:</div>
            <div class="row"><span>Кассовая книга:</span><select id="kassa"><option value="🟢 Скинута">🟢 Скинута</option><option value="🔴 Нет">🔴 Нет</option></select></div>
            <div class="row"><span>Отчет ИИ:</span><select id="ii"><option value="🟢 Заполнен">🟢 Заполнен</option><option value="🔴 Нет">🔴 Нет</option></select></div>
            <div class="row"><span>Реестр:</span><select id="reestr"><option value="🟢 Заполнен">🟢 Заполнен</option><option value="🔴 Нет">🔴 Нет</option></select></div>
        </div>

        <div class="section">
            <div class="title">📱 Маркетинг и соцсети:</div>
            <div class="row"><span>📹 Постов в ВК:</span><input type="number" id="vk" value="0" min="0"></div>
            <div class="row"><span>✈️🔖 Постов в ТГ:</span><input type="number" id="tg" value="0" min="0"></div>
            <div class="row"><span>📺 Постов в Макс:</span><input type="number" id="max" value="0" min="0"></div>
        </div>
    </div>

    <div class="section">
        <div class="title">💰 Финансовый остаток:</div>
        <div class="row"><span>💵 В кассе денег:</span><input type="number" id="cash" placeholder="руб." min="0"></div>
        <div class="row"><span>🖥 В 1С денег:</span><input type="number" id="onec" placeholder="руб." min="0"></div>
        <div class="row"><span>💳 На карте денег:</span><input type="number" id="card" placeholder="руб." min="0"></div>
    </div>

    <button onclick="sendReport()">Отправить отчет</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const reportType = urlParams.get('type') || 'evening';

        if (reportType === 'morning') {
            document.getElementById('report-title').innerText = '📊 УТРЕННИЙ ОТЧЕТ';
            document.getElementById('evening-only').style.display = 'none';
        } else {
            document.getElementById('report-title').innerText = '📊 ВЕЧЕРНИЙ ОТЧЕТ';
        }

        function sendReport() {
            const cashVal = document.getElementById('cash').value;
            const onecVal = document.getElementById('onec').value;
            const cardVal = document.getElementById('card').value;

            // Валидация обязательных финансовых полей
            if (!cashVal || !onecVal || !cardVal) {
                if (tg && tg.showAlert) {
                    tg.showAlert("⚠️ Пожалуйста, заполните все финансовые поля!");
                } else {
                    alert("⚠️ Пожалуйста, заполните все финансовые поля!");
                }
                return;
            }

            const data = {
                type: reportType,
                cash: cashVal,
                onec: onecVal,
                card: cardVal
            };

            if (reportType === 'evening') {
                data.kassa = document.getElementById('kassa').value;
                data.ii = document.getElementById('ii').value;
                data.reestr = document.getElementById('reestr').value;
                data.vk = document.getElementById('vk').value || '0';
                data.tg = document.getElementById('tg').value || '0';
                data.max = document.getElementById('max').value || '0';
            }

            if (tg) {
                try {
                    tg.sendData(JSON.stringify(data));
                    tg.close();
                } catch (e) {
                    console.error("Ошибка sendData. Убедитесь, что WebApp открыт через KeyboardButton:", e);
                }
            } else {
                console.log("Данные (Запуск вне Telegram):", data);
            }
        }
    </script>
</body>
</html>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // ВАЖНО: Ваш точный URL функции Яндекс Облака
        const YANDEX_FUNCTION_URL = "https://yandexcloud.net";

        const urlParams = new URLSearchParams(window.location.search);
        const reportType = urlParams.get('type') || 'evening';

        // Улучшено: Пытаемся взять chat_id из параметров ссылки бота (для ПК) или из initData (для телефона)
        let chatId = urlParams.get('chat_id') || tg?.initDataUnsafe?.user?.id;
        let firstName = tg?.initDataUnsafe?.user?.first_name || "Сотрудник";

        if (reportType === 'morning') {
            document.getElementById('report-title').innerText = '📊 УТРЕННИЙ ОТЧЕТ';
            document.getElementById('evening-only').style.display = 'none';
        } else {
            document.getElementById('report-title').innerText = '📊 ВЕЧЕРНИЙ ОТЧЕТ';
        }

        async function sendReport() {
            const btn = document.getElementById('submit-btn');
            const cashVal = document.getElementById('cash').value;
            const onecVal = document.getElementById('onec').value;
            const cardVal = document.getElementById('card').value;

            if (!cashVal || !onecVal || !cardVal) {
                alert("⚠️ Пожалуйста, заполните все финансовые поля!");
                return;
            }

            // Если chat_id так и не удалось найти (для тестов вне Телеграма)
            if (!chatId) {
                chatId = prompt("Браузер не определил ваш Telegram ID. Введите ваш chat_id вручную для теста:");
                if (!chatId) return;
            }

            btn.disabled = true;
            btn.innerText = "Отправка...";

            const payload = {
                is_direct_fetch: true,
                chat_id: String(chatId).trim(),
                first_name: firstName,
                data: {
                    type: reportType,
                    cash: cashVal,
                    onec: onecVal,
                    card: cardVal
                }
            };

            if (reportType === 'evening') {
                payload.data.kassa = document.getElementById('kassa').value;
                payload.data.ii = document.getElementById('ii').value;
                payload.data.reestr = document.getElementById('reestr').value;
                payload.data.vk = document.getElementById('vk').value || '0';
                payload.data.tg = document.getElementById('tg').value || '0';
                payload.data.max = document.getElementById('max').value || '0';
            }

            try {
                const response = await fetch(YANDEX_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btn.innerText = "Успешно отправлено!";
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 1000);
                } else {
                    alert("Ошибка сервера при отправке отчета.");
                    btn.disabled = false;
                    btn.innerText = "Отправить отчет";
                }
            } catch (e) {
                alert("Ошибка сети. Проверьте интернет соединение.");
                btn.disabled = false;
                btn.innerText = "Отправить отчет";
            }
        }
    </script>
